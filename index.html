<!doctype html>
<html lang="uk">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Список бажань</title>
  </head>
  <body>
    <header>
      <h1>Список бажань</h1>
      <nav>
        <a href="#new">Додати бажання</a>
        <a href="#list">Мої бажання</a>
      </nav>
    </header>
  <div class="content">
    <main>
      <section id="new">
        <h2>Додати бажання</h2>
        <div>
          <label for="wishname">Введіть бажання</label>
          <input type="text" id="wishname" name="wish" />
        </div>

        <div>
          <label for="price">Введіть ціну бажаної речі</label>
          <input type="text" id="price" name="wishPrice" />
        </div>
      </section>

      <section id="list">
        <h2>Мої бажання</h2>

        <div class="cards">
        <article class="card">
          <h3>Блиск для губ 400грн</h3>
        </article>

        <article class="card purchased">
          <h3>Книга 500грн</h3>
        </article>

        <article class="card">
          <h3>Цукерки 100грн</h3>
        </article>
      </div>
      </section>
    </main>
    <aside>
      <p>Підсумкова сума: 1000 грн</p>
    </aside>
  </div>
    <footer>
      <p>Шевчук Крістіна, ПВЗ, 2026</p>
    </footer>
  </body>
</html>
