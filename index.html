<!doctype html>
<html lang="uk">
  <head>
    <link rel="stylesheet" href="style.css" />
    <script src="script.js" defer></script>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400..700&display=swap" rel="stylesheet">
    <title>Список бажань</title>
  </head>
  <body>
    <header>
      <h1>Список бажань</h1>
      <nav>
        <a href="#new">Додати бажання</a>
        <a href="#list">Мої бажання</a>
      </nav>
    </header>
  <div class="content">
    <main>


      <section id="new">
        <h2>Додати бажання</h2>
        <form id="wish-form">
        <div>
          <label for="title">Введіть бажання</label>
          <input type="text" id="title" name="title" required />
        </div>

        <div>
          <label for="price">Введіть ціну бажаної речі</label>
          <input type="number" id="price" name="price" min="0" required/>
        </div>

         <div>
          <label for="price">Пріоритетність бажання</label>
          <select id="priority" name="priority">
            <option value="низький">Низький</option>
            <option value="середній">Середній</option>
            <option value="високий">Високий</option>
          </select>
        </div>

        <button type="submit" class="buttonAdd">
          +
        </button>
        
        </form> 
      </section>


      <section id="list">
        <div class="section-header">
          <h2>Мої бажання</h2>
          <button id="reload-btn" class="buttonReload">Оновити</button>
         </div>
        <div class="cards" id="wishlist">
        <article class="card priority">
          <span class="cardName">
          Блиск для губ
          </span>

          <span class="cardPrice">
          400грн
          </span>
        </article>

        <article class="card purchased">
          <span class="cardName">
          Книга
          </span>
          <span class="cardPrice">
          500грн
          </span>
        </article>

        <article class="card">
          <span class="cardName">
          Цукерки
          </span>
          <span class="cardPrice">
          100грн
          </span>
        </article>
      </div>
      </section>
    </main>

    <aside>
      <p id="total-price">Підсумкова сума: 0 грн</p>
    </aside>
  </div>
    <footer>
      <p>Шевчук Крістіна, ПВЗ, 2026</p>
    </footer>
  </body>
</html>
