<!doctype html>
<html lang="uk">
  <head>
    <link rel="stylesheet" href="style.css" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400..700&display=swap" rel="stylesheet">
    <title>Список бажань</title>
  </head>
  <body>
    <header>
      <h1>Список бажань</h1>
      <nav>
        <a href="#new">Додати бажання</a>
        <a href="#list">Мої бажання</a>
      </nav>
    </header>
  <div class="content">
    <main>
      <section id="new">
        <h2>Додати бажання</h2>
        <div>
          <label for="wishname">Введіть бажання</label>
          <input type="text" id="wishname" name="wish" />
        </div>

        <div>
          <label for="price">Введіть ціну бажаної речі</label>
          <input type="text" id="price" name="wishPrice" />
        </div>

        <button type="button" class="buttonAdd">
          +
        </button>
      </section>

      <section id="list">
        <h2>Мої бажання</h2>

        <div class="cards">
        <article class="card priority">
          <span class="cardName">
          Блиск для губ
          </span>

          <span class="cardPrice">
          400грн
          </span>
        </article>

        <article class="card purchased">
          <span class="cardName">
          Книга
          </span>
          <span class="cardPrice">
          500грн
          </span>
        </article>

        <article class="card">
          <span class="cardName">
          Цукерки
          </span>
          <span class="cardPrice">
          100грн
          </span>
        </article>
      </div>
      </section>
    </main>

    <aside>
      <p>Підсумкова сума: 1000 грн</p>
    </aside>
  </div>
    <footer>
      <p>Шевчук Крістіна, ПВЗ, 2026</p>
    </footer>
  </body>
</html>
